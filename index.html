<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War Index</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap/dist/maps/world.js"></script>

    <style>
        body { background-color: #0B0F19; color: #E2E8F0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        .circle-wrap { width: 160px; height: 160px; background: #1E293B; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); margin: 0 auto;}
        .circle-wrap::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #0B0F19; z-index: 1; }
        .score-text { position: relative; z-index: 2; font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        #map { width: 100%; height: 300px; }
        
        .ticker-wrap { position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background: rgba(15, 23, 42, 0.95); border-top: 2px solid #ef4444; overflow: hidden; z-index: 9999; display: flex; align-items: center; }
        .ticker-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 45s linear infinite; }
        .ticker-content:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8 pb-16 font-sans">
    
    <header class="w-full max-w-5xl mt-2 mb-8 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 tracking-tight uppercase">
            World War Index
        </h1>
        <p class="text-slate-400 mt-2 text-sm tracking-widest uppercase" id="last-updated">Awaiting sync...</p>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Score & Chart -->
        <div class="glass p-6 rounded-2xl md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
            <div class="text-center">
                <h2 class="text-lg font-semibold text-slate-300 mb-4">Today's Probability</h2>
                <div class="circle-wrap mb-4" id="score-circle">
                    <span class="score-text text-slate-100" id="main-score">--</span>
                </div>
                <h3 class="text-xl font-black text-slate-300 uppercase tracking-widest" id="status-text">LOADING...</h3>
            </div>
            <div class="w-full h-full min-h-[200px]">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- NEW: The 6 Custom Indicators -->
        <div class="glass p-6 rounded-2xl md:col-span-1 flex flex-col justify-between">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Risk Indicators</h3>
            <div id="indicators-container" class="space-y-4 w-full">
                <!-- Javascript will inject the 6 progress bars here -->
            </div>
        </div>

        <!-- Map -->
        <div class="glass p-6 rounded-2xl md:col-span-3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Global Conflict Heat Map</h3>
                <div class="flex space-x-3 text-[10px] text-slate-400 uppercase font-bold">
                    <span class="flex items-center"><div class="w-3 h-3 bg-red-500 mr-1 rounded-sm"></div> Ongoing</span>
                    <span class="flex items-center"><div class="w-3 h-3 bg-orange-500 mr-1 rounded-sm"></div> Threat</span>
                    <span class="flex items-center"><div class="w-3 h-3 bg-yellow-500 mr-1 rounded-sm"></div> Potential</span>
                </div>
            </div>
            <div id="map"></div>
        </div>

    </main>

    <!-- News Ticker -->
    <div class="ticker-wrap shadow-[0_-5px_20px_rgba(239,68,68,0.2)]">
        <div class="ticker-content text-sm uppercase tracking-wider" id="ticker-text">
            <span class="text-slate-400 font-medium">ESTABLISHING CONNECTION TO GLOBAL NEWS FEEDS...</span>
        </div>
    </div>

    <script>
        let trendChartInstance = null;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                // Set Main Score
                const score = data.global_risk_score;
                document.getElementById('main-score').innerText = score;
                const statusEl = document.getElementById('status-text');
                statusEl.innerText = data.status;
                
                if (score < 55) { statusEl.className = "text-xl font-black text-green-400 uppercase tracking-widest"; document.getElementById('main-score').classList.add('text-green-400'); } 
                else if (score < 75) { statusEl.className = "text-xl font-black text-yellow-400 uppercase tracking-widest"; document.getElementById('main-score').classList.add('text-yellow-400'); } 
                else { statusEl.className = "text-xl font-black text-red-500 uppercase tracking-widest pulse"; document.getElementById('main-score').classList.add('text-red-500'); document.getElementById('score-circle').style.boxShadow = "inset 0 0 20px rgba(239, 68, 68, 0.4)"; }

                const date = new Date(data.timestamp);
                document.getElementById('last-updated').innerText = "Last Updated: " + date.toLocaleDateString() + " " + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + " UTC";

                // Build the 6 Progress Bars
                const indContainer = document.getElementById('indicators-container');
                if (data.indicators) {
                    indContainer.innerHTML = data.indicators.map(ind => {
                        let colorClass = ind.score > 70 ? 'bg-red-500' : ind.score > 50 ? 'bg-yellow-500' : 'bg-green-500';
                        let textClass = ind.score > 70 ? 'text-red-400' : ind.score > 50 ? 'text-yellow-400' : 'text-green-400';
                        return `
                        <div>
                            <div class="flex justify-between text-[9px] uppercase font-bold text-slate-300 mb-1">
                                <span>${ind.name} <span class="text-slate-500">(${ind.weight}%)</span></span>
                                <span class="${textClass}">${ind.score}/100</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-1.5 border border-slate-700">
                                <div class="h-1.5 rounded-full ${colorClass} transition-all duration-1000" style="width: ${ind.score}%"></div>
                            </div>
                        </div>`;
                    }).join('');
                }

                // Populate Ticker
                const headlines = data.headlines || [];
                const tickerEl = document.getElementById('ticker-text');
                if (headlines.length > 0) {
                    tickerEl.innerHTML = headlines.map(h => `<span class="mx-6 text-slate-200 font-bold">⚠️ ${h}</span>`).join('<span class="text-red-500 pulse"> • </span>');
                } else {
                    tickerEl.innerHTML = '<span class="mx-6 text-green-400 font-bold">NO MAJOR ESCALATIONS DETECTED IN LAST 24 HOURS</span>';
                }

                // Build Chart
                const dates = data.history.map(h => h.date);
                const scores = data.history.map(h => h.score);
                const ctx = document.getElementById('trendChart').getContext('2d');
                if(trendChartInstance) trendChartInstance.destroy();
                trendChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: dates, datasets: [{ label: 'Index Score', data: scores, borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false, color: '#334155' }, ticks: { color: '#94a3b8', maxTicksLimit: 6 } }, y: { min: 0, max: 100, grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } } } }
                });

                // Build Map
                const mapData = data.map_data || {};
                const regionValues = {};
                for (const [countryCode, threatLevel] of Object.entries(mapData)) {
                    if (threatLevel === 3) regionValues[countryCode] = 'level3';
                    else if (threatLevel === 2) regionValues[countryCode] = 'level2';
                    else if (threatLevel === 1) regionValues[countryCode] = 'level1';
                }

                document.getElementById('map').innerHTML = ""; 
                new jsVectorMap({
                    selector: '#map',
                    map: 'world', backgroundColor: 'transparent', zoomOnScroll: false,
                    regionStyle: { initial: { fill: '#1e293b', stroke: '#0B0F19', strokeWidth: 0.5 }, hover: { fill: '#cbd5e1' } },
                    series: { regions: [{ attribute: 'fill', scale: { 'level3': '#ef4444', 'level2': '#f97316', 'level1': '#eab308' }, values: regionValues }] }
                });

            } catch (error) { console.log(error); }
        }
        loadData();
    </script>
</body>
</html>
